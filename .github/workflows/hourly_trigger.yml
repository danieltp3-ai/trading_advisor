name: Hourly Signal Trigger

on:
  schedule:
    - cron: "4 * * * *"   # run 4 minutes after the hour
  workflow_dispatch:

jobs:
  run-mamo:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PythonAnywhere
        run: |
          echo "Pinging PythonAnywhere..."
          curl -sS "$PA_URL"
        env:
          PA_URL: ${{ secrets.PA_URL }}
